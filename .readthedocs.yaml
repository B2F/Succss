## Read the Docs configuration.
##
## This repository already contains a static documentation website under `Succss-doc/`.
## We publish it as-is by copying it to `$READTHEDOCS_OUTPUT/html/`.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Keep explicit steps to make RTD build logs easy to read.
    create_environment:
      - python -V
    install:
      - python -V
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -r Succss-doc/* "$READTHEDOCS_OUTPUT/html/"
